{{ $json := .Get "json" }}
{{ $height := .Get "height" | default "200px" }}
{{ $id := printf "plotly-%s" (md5 $json) }}

<div id="{{ $id }}" class="plotly" style="height: {{ $height }};"></div>

<script>
(async () => {
  // 1) Charger Plotly si nécessaire (une seule fois pour toute la page)
  if (!window.Plotly) {
    if (!window.__plotlyLoadingPromise) {
      window.__plotlyLoadingPromise = new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = "https://cdn.plot.ly/plotly-2.27.0.min.js";
        s.async = true;
        s.onload = () => resolve();
        s.onerror = () => reject(new Error("Échec de chargement Plotly (CDN)."));
        document.head.appendChild(s);
      });
    }
    try {
      await window.__plotlyLoadingPromise;
    } catch (e) {
      console.error(e);
      return;
    }
  }

  if (!window.Plotly) {
    console.error("Plotly absent après chargement :", "{{ $id }}");
    return;
  }

  // 2) Charger la figure JSON et tracer
  const url = "{{ $json | relURL }}";
  const res = await fetch(url);
  if (!res.ok) {
    console.error("JSON Plotly introuvable:", url, res.status);
    return;
  }
  const fig = await res.json();
  Plotly.newPlot("{{ $id }}", fig.data, fig.layout, { responsive: true });
})();
</script>
