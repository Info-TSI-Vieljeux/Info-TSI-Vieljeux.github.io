name: Déploiement Hugo vers GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Garder cette version alignée avec celle utilisée en local (hugo version).
  HUGO_VERSION: 0.163.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4

      - name: Installer Hugo (extended)
        run: |
          curl -sSL -o hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      - name: Configurer GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Construire le site
        env:
          HUGO_BASEURL: ${{ steps.pages.outputs.base_url }}
        # Pas de --minify : le premier graphique Plotly de
        # Semestre_3/tp11.md est tronqué en plein milieu de son tableau
        # de données JSON (copier-coller incomplet), ce qui casse le
        # parseur JS du minifieur. Reconstituer les données manquantes
        # n'est pas sûr à faire à l'aveugle, donc on ne minifie pas.
        run: hugo --baseURL "${HUGO_BASEURL}"

      - name: Publier l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
